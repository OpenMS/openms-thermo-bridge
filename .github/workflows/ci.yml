name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Shared builds use hidden visibility: they check the exported API, and the
        # bench is an external consumer of it.
        shared:
          - OFF
          - ON

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Debug .NET environment
        shell: bash
        run: |
          echo "=== which dotnet ==="
          which dotnet || true
          echo "=== dotnet --info ==="
          dotnet --info || true
          echo "=== DOTNET_ROOT ==="
          echo "DOTNET_ROOT=${DOTNET_ROOT:-<not set>}"
          echo "=== .NET packs ==="
          if [ -d "${DOTNET_ROOT:-/usr/share/dotnet}/packs" ]; then
            find "${DOTNET_ROOT:-/usr/share/dotnet}/packs" -maxdepth 4 -name 'nethost*' -o -name 'libnethost*' 2>/dev/null | head -30 || true
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build" \
            -DOPENMS_THERMO_BRIDGE_ENABLE_VENDOR_DOWNLOAD=ON \
            -DOPENMS_THERMO_BRIDGE_DOWNLOAD_TEST_DATA=ON \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DOPENMS_THERMO_BRIDGE_BUILD_BENCH=${{ matrix.shared }}

      - name: Build
        shell: bash
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config Release --parallel

      - name: Debug runtime files
        shell: bash
        run: |
          echo "=== Managed directory ==="
          ls -la "${GITHUB_WORKSPACE}/build/openms_thermo_bridge_managed/" 2>/dev/null || echo "managed dir not found"
          echo "=== Test executable directory ==="
          if [ -d "${GITHUB_WORKSPACE}/build/Release" ]; then
            ls -la "${GITHUB_WORKSPACE}/build/Release/" 2>/dev/null || true
            ls -la "${GITHUB_WORKSPACE}/build/Release/managed/" 2>/dev/null || true
          else
            ls -la "${GITHUB_WORKSPACE}/build/" 2>/dev/null | head -20 || true
            ls -la "${GITHUB_WORKSPACE}/build/managed/" 2>/dev/null || true
          fi
          echo "=== Test executable exists ==="
          find "${GITHUB_WORKSPACE}/build" -name 'thermo_bridge_tests*' -type f 2>/dev/null | head -5 || true

      - name: Run tests
        shell: bash
        run: ctest --test-dir "${GITHUB_WORKSPACE}/build" --build-config Release --output-on-failure -V

      - name: Install package
        shell: bash
        run: cmake --install "${GITHUB_WORKSPACE}/build" --config Release --prefix "${GITHUB_WORKSPACE}/install"

      # An installed executable with the static bridge must find
      # <libdir>/openms_thermo_bridge/managed on its own. Shared builds are skipped because the
      # installed thermo_host has no RPATH to the library, Windows because nethost.dll is not
      # installed next to thermo_host.exe.
      - name: Run installed thermo_host
        if: runner.os != 'Windows' && matrix.shared == 'OFF'
        shell: bash
        run: |
          output="$("${GITHUB_WORKSPACE}/install/bin/thermo_host" "${GITHUB_WORKSPACE}/build/testdata/ginkgotoxin-ms-positive.raw")"
          echo "${output}"
          [[ "${output}" == *"Scan count: 90"* ]]

      # Without nuget.org as a source, every package must come from the vendor feed. An empty
      # NUGET_PACKAGES keeps the packages restored by the build above out of it.
      - name: Build with OPENMS_THERMO_BRIDGE_NUGET_OFFLINE
        if: runner.os == 'Linux' && matrix.shared == 'OFF'
        shell: bash
        run: |
          feed="${RUNNER_TEMP}/offline-feed"
          mkdir -p "${feed}"
          find "${NUGET_PACKAGES:-${HOME}/.nuget/packages}" -name '*.nupkg' -exec cp {} "${feed}" \;
          export NUGET_PACKAGES="${RUNNER_TEMP}/offline-nuget-packages"
          cmake -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-offline" \
            -DOPENMS_THERMO_BRIDGE_NUGET_OFFLINE=ON \
            -DOPENMS_THERMO_BRIDGE_VENDOR_DIR="${feed}" \
            -DBUILD_TESTING=OFF
          if grep -q nuget.org "${GITHUB_WORKSPACE}/build-offline/OpenMSThermoBridge.NuGet.config"; then
            echo "nuget.org is still a package source" >&2
            exit 1
          fi
          cmake --build "${GITHUB_WORKSPACE}/build-offline" --parallel
